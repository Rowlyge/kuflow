services:
  postgres:
    image: postgres:16

    container_name: proxy-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: proxydb
      POSTGRES_USER: proxy
      POSTGRES_PASSWORD: proxy

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proxy -d proxydb"]
      interval: 10s
      timeout: 5s
      retries: 5

  kuflow:
    build: .

    container_name: kuflow

    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "18080:8080"

    environment:
      DATABASE_URL: postgres://proxy:proxy@postgres:5432/proxydb?sslmode=disable

volumes:
  postgres_data: